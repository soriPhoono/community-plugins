id           = "soriphoono/work-clock"
name         = "Work Clock"
version      = "0.1.0"
plugin_api   = 22
author       = "soriphoono"
license = "MIT"
icon = "brain"
description = "Pomodoro work timer with IPC control, widget click actions and a progress bar."
tags = ["bar", "panel", "service", "productivity", "time"]

[[setting]]
key     = "work-duration"
type    = "int"
label_key = "settings.work-duration.label"
description_key = "settings.work-duration.description"
default = 25

[[setting]]
key     = "short-break-duration"
type    = "int"
label_key = "settings.short-break-duration.label"
description_key = "settings.short-break-duration.description"
default = 5

[[setting]]
key     = "long-break-duration"
type    = "int"
label_key = "settings.long-break-duration.label"
description_key = "settings.long-break-duration.description"
default = 15

[[setting]]
key     = "sessions-before-long-break"
type    = "int"
label_key = "settings.sessions-before-long-break.label"
description_key = "settings.sessions-before-long-break.description"
default = 4
min = 1

[[setting]]
key     = "auto-start-breaks"
type    = "bool"
label_key = "settings.auto-start-breaks.label"
description_key = "settings.auto-start-breaks.description"
default = false

[[setting]]
key     = "auto-start-work"
type    = "bool"
label_key = "settings.auto-start-work.label"
description_key = "settings.auto-start-work.description"
default = false

[[setting]]
key     = "enable-work-timer-sound"
type    = "bool"
label_key = "settings.enable-work-timer-sound.label"
description_key = "settings.enable-work-timer-sound.description"
default = false

[[setting]]
key     = "use-bundled-alarm-sound"
type    = "bool"
label_key = "settings.use-bundled-alarm-sound.label"
description_key = "settings.use-bundled-alarm-sound.description"
default = false

[[widget]]
id = "widget"
entry = "src/widget.luau"

    [widget.actions]
    left   = "plugin soriphoono/work-clock:pomodoro all toggle"
    middle = "plugin soriphoono/work-clock:pomodoro all skip"
    right  = "panel-toggle soriphoono/work-clock:panel"

    [[widget.setting]]
    key     = "widget-glyph-main"
    type    = "glyph"
    label_key = "settings.widget.glyph-main.label"
    description_key = "settings.widget.glyph-main.description"
    default = "brain"

    [[widget.setting]]
    key     = "widget-glyph-work"
    type    = "glyph"
    label_key = "settings.widget.glyph-work.label"
    description_key = "settings.widget.glyph-work.description"
    default = "brain"

    [[widget.setting]]
    key     = "widget-glyph-break"
    type    = "glyph"
    label_key = "settings.widget.glyph-break.label"
    description_key = "settings.widget.glyph-break.description"
    default = "coffee"

[[panel]]
id = "panel"
entry = "src/panel.luau"
placement = "attached"
open_near_click = true
width = 350
height = 250

[[service]]
id = "pomodoro"
entry = "src/pomodoro.luau"
